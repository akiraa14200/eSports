        const { data: { session } } = await client.auth.getSession();
        const old = JSON.parse(localStorage.getItem("ff_currentUser") || "null");
        if (!session) { if (old && old.authUserId) { localStorage.removeItem("ff_currentUser"); location.reload(); } return; }

        for (let attempt = 0; attempt < 5 && !profile; attempt++) {
          const { data, error } = await client.from("player_profiles").select("user_id,display_name,player_code,free_fire_uid,ign,region,avatar_url,verification_status,is_suspended").eq("user_id", session.user.id).maybeSingle();

        if (profile.is_suspended) { await client.auth.signOut(); alert("This player account is suspended."); return; }

      } catch (e) { console.error("Supabase auth/profile sync failed", e); }
    }
    client.auth.onAuthStateChange(() => { setTimeout(syncAuthProfile, 0); });
    syncAuthProfile();
  })();

 window.ffRequestJoinTeam=async function(code){try{const client=await window.ffSupabaseReady;const {data:{session}}=await client.auth.getSession();if(!session?.user?.id){alert('Please sign in first.');return;}const {data,error}=await client.rpc('request_squad_join',{p_team_code:code.trim()});if(error)throw error;alert('Join request sent to '+(data?.team_name||'the team leader')+'. They can accept or deny it from My Teams.');}catch(e){alert('Could not send join request: '+(e.message||'Please try again.'));}};
 async function mountInbox(){const heading=[...document.querySelectorAll('h2,h3')].find(el=>el.textContent.includes('MY TEAMS & INVITATIONS'));if(!heading||document.getElementById('ff-squad-join-inbox'))return;const root=heading.parentElement?.parentElement?.parentElement;if(!root)return;const box=document.createElement('section');box.id='ff-squad-join-inbox';box.className='ff-join-inbox';box.innerHTML='<h3>TEAM JOIN REQUESTS</h3><div class="ff-join-list text-zinc-400 text-sm">Checking pending requests…</div>';const header=heading.parentElement?.parentElement;if(header&&header.parentElement===root)header.insertAdjacentElement('afterend',box);else root.prepend(box);
 try{const client=await window.ffSupabaseReady;const {data:{session}}=await client.auth.getSession();if(!session?.user?.id){box.querySelector('.ff-join-list').textContent='Sign in to manage join requests.';return;}async function refresh(){const {data,error}=await client.rpc('list_my_squad_join_requests');if(error)throw error;const list=box.querySelector('.ff-join-list');list.innerHTML='';if(!data?.length){list.textContent='No pending join requests.';return;}data.forEach(req=>{const row=document.createElement('div');row.className='ff-join-row';const info=document.createElement('div');const title=document.createElement('div');title.className='font-bold text-white';title.textContent=req.requester_name+' wants to join '+req.squad_name;const meta=document.createElement('div');meta.className='text-xs text-zinc-500';meta.textContent=new Date(req.requested_at).toLocaleString();info.append(title,meta);const actions=document.createElement('div');actions.className='ff-join-actions';[['Accept',true,'ff-join-accept'],['Deny',false,'ff-join-deny']].forEach(([label,accept,cls])=>{const btn=document.createElement('button');btn.className=cls;btn.textContent=label;btn.onclick=async()=>{btn.disabled=true;try{const {error}=await client.rpc('respond_squad_join',{p_request_id:req.request_id,p_accept:accept});if(error)throw error;await refresh();alert(accept?'Player accepted into team.':'Join request denied.');}catch(e){alert(e.message||'Could not process request.');btn.disabled=false;}};actions.appendChild(btn);});row.append(info,actions);list.appendChild(row);});}await refresh();}catch(e){const list=box.querySelector('.ff-join-list');if(list)list.textContent='Could not load requests: '+(e.message||'Please refresh.');}}
 const observer=new MutationObserver(()=>mountInbox());observer.observe(document.body,{childList:true,subtree:true});setTimeout(mountInbox,1200);
})();
</script>
</body>
</html>
